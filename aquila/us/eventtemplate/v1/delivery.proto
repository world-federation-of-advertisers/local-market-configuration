syntax = "proto3";

package halo_cmm.aquila.us.eventtemplate.v1;

import "wfa/measurement/api/v2alpha/event_annotations.proto";
import "wfa/measurement/api/v2alpha/media_type.proto";

option java_package = "org.halo_cmm.aquila.us.eventtemplate.v1";
option java_multiple_files = true;

message Delivery {
  option (.wfa.measurement.api.v2alpha.event_template) = {
    name: "delivery"
    display_name: "Delivery"
    description: "Describes the delivery surface of the event, including "
                 "media type, platform, and placement. Applies across all "
                 "media types."
  };

  // The media type of the event (e.g. VIDEO, DISPLAY, OTHER).
  //
  // This should be consistent with which media-specific sub-template is
  // populated on the containing Event (e.g. `video`, `display`, `other`).
  .wfa.measurement.api.v2alpha.MediaType media_type = 1
      [(.wfa.measurement.api.v2alpha.template_field) = {
        display_name: "Media Type"
        reporting_features: FILTERABLE
        reporting_features: GROUPABLE
        version_added: 3
      }];

  // EDP-specific publisher platform on which the event was delivered, e.g.
  // "INSTAGRAM", "FACEBOOK", "GOOGLE_AD_NETWORK". Values are defined by the
  // EDP and are not standardized across EDPs.
  string platform = 2 [(.wfa.measurement.api.v2alpha.template_field) = {
    display_name: "Platform"
    reporting_features: FILTERABLE
    reporting_features: GROUPABLE
    version_added: 3
  }];

  // EDP-specific placement within the platform on which the event was
  // delivered, e.g. "FEED", "STORIES", "REELS". Values are defined by the
  // EDP and are not standardized across EDPs.
  string placement = 3 [(.wfa.measurement.api.v2alpha.template_field) = {
    display_name: "Placement"
    reporting_features: FILTERABLE
    reporting_features: GROUPABLE
    version_added: 3
  }];
}
