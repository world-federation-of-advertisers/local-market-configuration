syntax = "proto3";

package halo_cmm.aquila.us.eventtemplate.v1;

import "wfa/measurement/api/v2alpha/event_annotations.proto";

option java_package = "org.halo_cmm.aquila.us.eventtemplate.v1";
option java_multiple_files = true;

// Meta-specific event fields (Facebook, Instagram, Messenger).
message Meta {
  // Placement on a Meta surface.
  enum Placement {
    // Default value. Not a valid choice; events should always specify a
    // concrete placement.
    PLACEMENT_UNSPECIFIED = 0;
    FACEBOOK_DESKTOP_NEWS_FEED = 1;
    FACEBOOK_INSTREAM = 2;
    FACEBOOK_MOBILE_NEWS_FEED = 3;
    FACEBOOK_REELS = 4;
    FACEBOOK_RIGHT_HAND_SIDE = 5;
    FACEBOOK_STORIES = 6;
    FACEBOOK_VIDEO_FEED = 7;
    INSTAGRAM_EXPLORE = 8;
    INSTAGRAM_FEED = 9;
    INSTAGRAM_REELS = 10;
    INSTAGRAM_STORIES = 11;
    MARKETPLACE = 12;
    MESSENGER = 13;
    OTHER = 14;
  }

  // Placement on a Meta surface.
  Placement placement = 1 [(.wfa.measurement.api.v2alpha.template_field) = {
    display_name: "Meta Placement"
    reporting_features: FILTERABLE
    reporting_features: GROUPABLE
    version_added: 3
  }];
}
